name: Sync main into dev

# main is a near-pure mirror of upstream HKUDS/nanobot (see sync-upstream.yml).
# dev is the Exeio product branch: main's history plus the branding overlay
# (webui/src/brand/**) and deployment tooling (deployment/**).
#
# This used to hard-restore webui/** to dev's version on every run, because
# the rebrand was edited directly into ~170 upstream-owned locale files. That
# silently discarded every upstream webui change — including the ones shipped
# atomically with the Python backend that serves them. Branding is now applied
# at render time (webui/src/brand/exeio-brand.ts), so dev's webui tracks
# upstream directly and no path exclusion is needed: a plain merge is correct.
#
# deployment/** needs no exclusion either — upstream has no such directory, so
# it can never conflict.
#
# Runs right after main moves (push trigger) so dev never falls more than
# one sync behind.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

env:
  SYNC_LABEL: sync-main-to-dev
  BOT_NAME: "github-actions[bot]"
  BOT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"

      - name: Ensure the sync label exists
        run: gh label create "$SYNC_LABEL" --color C5DEF5 --description "Automated main-into-dev sync PR" --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bail out if a sync PR is already open
        id: existing
        run: |
          count="$(gh pr list --label "$SYNC_LABEL" --state open --json number --jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "::notice::An open main->dev sync PR already exists — skipping this run so we don't pile up duplicates."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch dev
        if: steps.existing.outputs.count == '0'
        run: git fetch origin dev

      - name: Check for drift
        id: drift
        if: steps.existing.outputs.count == '0'
        run: |
          new_commits="$(git rev-list origin/dev..origin/main --count)"
          echo "new_commits=$new_commits" >> "$GITHUB_OUTPUT"
          echo "main is $new_commits commit(s) ahead of dev."

      - name: Create sync branch and merge main
        id: merge
        if: steps.existing.outputs.count == '0' && steps.drift.outputs.new_commits != '0'
        run: |
          branch="sync/main-to-dev-$(date -u +%Y-%m-%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch" origin/dev

          if ! git merge --no-commit --no-ff origin/main; then
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

          git add -A
          git commit -m "sync: merge main into dev" || true

      - name: Categorize the resulting diff (docs-only vs core)
        id: scope
        if: steps.existing.outputs.count == '0' && steps.drift.outputs.new_commits != '0'
        run: |
          changed="$(git diff --name-only origin/dev..HEAD)"
          non_docs="$(grep -vE '^docs/' <<< "$changed")"
          if [ -z "$changed" ]; then
            echo "scope=empty" >> "$GITHUB_OUTPUT"
          elif [ -z "$non_docs" ]; then
            echo "scope=docs-only" >> "$GITHUB_OUTPUT"
          else
            echo "scope=core" >> "$GITHUB_OUTPUT"
          fi
          echo "$changed"

      - name: Push sync branch
        if: >-
          steps.existing.outputs.count == '0' && steps.drift.outputs.new_commits != '0'
          && steps.scope.outputs.scope != 'empty'
        # --force: this is a bot-owned, throwaway integration branch rebuilt
        # from scratch every run — a retry on the same day must be able to
        # overwrite a stale push from an earlier failed attempt.
        run: git push --force origin "${{ steps.merge.outputs.branch }}"

      - name: Open the sync PR
        id: pr
        if: >-
          steps.existing.outputs.count == '0' && steps.drift.outputs.new_commits != '0'
          && steps.scope.outputs.scope != 'empty'
        run: |
          scope="${{ steps.scope.outputs.scope }}"
          conflicts="${{ steps.merge.outputs.has_conflicts }}"

          title="sync: merge main into dev ($scope)"
          body="Automated merge of \`main\` into \`dev\`. No paths are excluded — branding is applied at render time (\`webui/src/brand/exeio-brand.ts\`), so upstream's webui changes flow in directly and any new channel's locale bundle is branded automatically.

          **Scope detected:** \`$scope\`
          **Merge conflicts:** \`$conflicts\`"

          if [ "$conflicts" = "true" ]; then
            body="$body

          > [!CAUTION]
          > The merge had conflicts. The likely spots are the few files dev still edits in place — \`webui/index.html\` (pre-boot copy) and the brand asset references. Resolve on the \`${{ steps.merge.outputs.branch }}\` branch, keeping Exeio's branding while folding in main's underlying change."
          fi

          pr_url="$(gh pr create \
            --base dev \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "$title" \
            --body "$body" \
            --label "$SYNC_LABEL")"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

          if [ "$scope" = "docs-only" ] && [ "$conflicts" != "true" ]; then
            echo "auto_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for docs-only PRs
        if: steps.pr.outputs.auto_merge == 'true'
        run: gh pr merge --auto --merge "${{ steps.pr.outputs.url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
