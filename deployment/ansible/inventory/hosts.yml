---
# Single-host inventory. This project deploys one nanobot instance to one VPS —
# no host groups, no dynamic inventory, no multi-environment split. Add a
# second host block (and a second entry under group_vars/) only if you
# actually stand up a second instance.
all:
  hosts:
    nanobot-vps:
      # Replace once the OVH VPS exists.
      ansible_host: 203.0.113.10
      ansible_user: deploy
      # ansible_ssh_private_key_file: ~/.ssh/id_ed25519_nanobot_vps
