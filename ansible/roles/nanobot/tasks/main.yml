---
- name: Checkout nanobot-exeio at the pinned ref
  ansible.builtin.git:
    repo: "{{ nanobot_repo_url }}"
    dest: "{{ nanobot_deploy_dir }}"
    version: "{{ nanobot_repo_ref }}"
    force: false
  become: true
  become_user: "{{ ansible_user }}"

- name: Ensure the nanobot data directory exists
  ansible.builtin.file:
    path: "{{ nanobot_data_dir }}"
    state: directory
    mode: "0750"

- name: Chown the data directory to the container's built-in UID
  # The image's entrypoint runs as UID 1000 ("nanobot") once it drops root —
  # see Dockerfile. This is the exact fix docs/deployment.md documents for
  # "Permission denied" on the bind mount.
  ansible.builtin.file:
    path: "{{ nanobot_data_dir }}"
    owner: "1000"
    group: "1000"
    recurse: true

- name: Template the deploy-time .env (Compose build-arg substitution + container runtime secrets)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nanobot_deploy_dir }}/.env"
    mode: "0600"
    owner: "{{ ansible_user }}"
  notify: Restart nanobot services
  no_log: true # this file is rendered from vaulted secrets

- name: Template config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ nanobot_data_dir }}/config.json"
    mode: "0600"
    owner: "1000"
    group: "1000"
  notify: Restart nanobot services
  no_log: true # contains provider keys until they're all switched to ${VAR} form

- name: Template the Compose override (env_file passthrough + host-specific binds)
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ nanobot_deploy_dir }}/docker-compose.override.yml"
    mode: "0644"
    owner: "{{ ansible_user }}"
  notify: Restart nanobot services

- name: Build the nanobot image (Docker layer cache keeps repeat runs fast)
  community.docker.docker_compose_v2:
    project_src: "{{ nanobot_deploy_dir }}"
    files:
      - docker-compose.yml
      - docker-compose.override.yml
    build: always
    state: present
    services:
      - nanobot-gateway
  become: true
  become_user: "{{ ansible_user }}"

- name: Start the gateway (and API server, if enabled)
  community.docker.docker_compose_v2:
    project_src: "{{ nanobot_deploy_dir }}"
    files:
      - docker-compose.yml
      - docker-compose.override.yml
    state: present
    services: "{{ nanobot_services }}"
  become: true
  become_user: "{{ ansible_user }}"

- name: Wait for the gateway health endpoint to come up
  ansible.builtin.uri:
    url: "http://127.0.0.1:18790/"
    status_code: [200, 404] # the health route is minimal; any HTTP response means the process is up
  register: gateway_health
  until: gateway_health.status is defined
  retries: 10
  delay: 3
  become: true
  become_user: "{{ ansible_user }}"
